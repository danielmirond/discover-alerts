name: "[All] Search Profiles Poll"

on:
  schedule:
    # Lunes 03:00 UTC — semanal
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: search-profiles-poll
  cancel-in-progress: true

jobs:
  poll:
    strategy:
      matrix:
        instance:
          - { name: main, env: production }
          - { name: sport, env: production-sport }
          - { name: motor, env: production-motor }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.instance.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline
      - run: npx tsx src/run-poll.ts search-profiles
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
