name: "[Motor] Content Audit Poll"

on:
  schedule:
    # Diario 04:00 UTC (después del primer discover-poll del día)
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: content-audit-poll-motor
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-motor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline
      - run: npx tsx src/run-poll.ts content-audit
        env:
          DISCOVERSNOOP_TOKEN: ${{ secrets.DISCOVERSNOOP_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FEEDS_PATH: feeds-motor.json
