            <div style={{ padding: 8, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)' }}>Sin patrones repetidos (≥2).</div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 4 }}>
              {(cur.trigrams || []).slice(0, 12).map(tg => {
                const id = `tg::${active}::${tg.ngram}`;
                const imported = isPatImported(id);
                return (
                <div key={tg.ngram} style={{ padding: '4px 8px', borderBottom: '1px solid var(--rule-2)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>
                    <span style={{ fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--ink)' }}>{tg.ngram}</span>
                    <span style={{ display: 'flex', gap: 6, alignItems: 'baseline' }}>
                      <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--accent)', fontWeight: 700 }}>×{tg.count}</span>
                      <button
                        onClick={() => addPattern({ id, kind: 'trigram', country: active, countryLabel: labels[active], ngram: tg.ngram, count: tg.count, examples: tg.examples })}
                        disabled={imported}
                        title={imported ? 'Ya importado' : 'Importar patrón'}
                        style={{ cursor: imported ? 'default' : 'pointer', fontFamily: 'var(--mono)', fontSize: 10, padding: '0 5px', background: imported ? 'var(--ok)' : 'transparent', color: imported ? 'var(--paper)' : 'var(--accent)', border: `1px solid ${imported ? 'var(--ok)' : 'var(--accent)'}`, lineHeight: 1.2 }}>
                        {imported ? '✓' : '+'}
                      </button>
                    </span>
                  </div>
                  {(tg.examples || []).slice(0, 1).map((ex, i) => (
                    <div key={i} style={{ fontFamily: 'var(--sans)', fontSize: 11, color: 'var(--ink-4)', marginTop: 2, fontStyle: 'italic', lineHeight: 1.3, display: '-webkit-box', WebkitLineClamp: 1, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>

            </div>
          )}
        </div>

        {/* Fórmulas estructurales */}
        <div>
          <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>

            <span className="meta">{(cur.formulas || []).length}</span>

            <div style={{ padding: 8, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)' }}>Sin fórmulas detectadas.</div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 6 }}>

                const id = `fm::${active}::${f.formula}`;
                const imported = isPatImported(id);

                <div key={f.formula} style={{ padding: '6px 8px', borderLeft: '3px solid var(--warn)', background: 'var(--paper-3)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>

                        title={imported ? 'Ya importado' : 'Importar fórmula'}
                        style={{ cursor: imported ? 'default' : 'pointer', fontFamily: 'var(--mono)', fontSize: 10, padding: '0 5px', background: imported ? 'var(--ok)' : 'transparent', color: imported ? 'var(--paper)' : 'var(--warn)', border: `1px solid ${imported ? 'var(--ok)' : 'var(--warn)'}`, lineHeight: 1.2 }}>
                        {imported ? '✓' : '+'}
                      </button>
                    </span>
                  </div>
                  {(f.examples || []).slice(0, 2).map((ex, i) => (
                    <div key={i} style={{ fontFamily: 'var(--sans)', fontSize: 11, color: 'var(--ink-3)', marginTop: 3, lineHeight: 1.3, display: '-webkit-box', WebkitLineClamp: 1, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
                      · {ex}
                    </div>
                  ))}
                </div>
                );})}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function CulturalView() {
  const [state, setState] = useState({ loading: true, data: null, error: null });
  useEffect(() => {
    let alive = true;
    fetch('/api/cultural', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(d => alive && setState({ loading: false, data: d, error: null }))
      .catch(e => alive && setState({ loading: false, data: null, error: e.message }));
    return () => { alive = false; };
  }, []);
  if (state.loading) return <div style={{ padding: 16, fontFamily: 'var(--mono)', color: 'var(--ink-3)' }}>Cargando…</div>;
  if (state.error) return <div style={{ padding: 16, color: 'var(--danger)' }}>Error: {state.error}</div>;
  const { netflixTop = [], flixpatrolTop = [], applePodcastsTop = [], steamTop = [], lastPoll, cultural = [], culturalEntityHits = [] } = state.data || {};
  // Mapa título → { inDiscover, discoverScore }
  const matchByTitle = new Map();
  cultural.forEach(c => matchByTitle.set(`${c.source}::${c.title}`, c));
  const enrichItem = (src, item) => ({ ...item, ...(matchByTitle.get(`${src}::${item.title}`) || {}) });
  const nfFilms = netflixTop.filter(x => /film/i.test(x.category)).slice(0, 10).map(x => enrichItem('netflix', x));
  const nfTv = netflixTop.filter(x => /tv/i.test(x.category)).slice(0, 10).map(x => enrichItem('netflix', x));
  const fpTv = flixpatrolTop.filter(x => x.category === 'TV').slice(0, 10).map(x => enrichItem('flixpatrol', x));
  const fpMov = flixpatrolTop.filter(x => x.category === 'Movies').slice(0, 10).map(x => enrichItem('flixpatrol', x));
  const discoverHitCount = cultural.filter(c => c.inDiscover).length;

  const renderList = (items, label, extra) => (
    <div>
      <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>
        {label}<span className="bar"></span><span className="meta">{items.length} items{extra ? ' · ' + extra : ''}</span>
      </div>
      {items.length === 0 ? (
        <div style={{ padding: 8, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)' }}>Sin datos en este poll.</div>
      ) : (
        <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--mono)', fontSize: 12 }}>
          <tbody>
            {items.map(i => (
              <tr key={`${i.rank}-${i.title}`} style={{ borderBottom: '1px solid var(--rule-2)' }}>
                <td style={{ padding: '4px 6px', width: 32, textAlign: 'right', color: 'var(--accent)', fontWeight: 600 }}>#{i.rank}</td>
                <td style={{ padding: '4px 6px', color: 'var(--ink)' }}>
                  {i.title}
                  {i.inDiscover && (
                    <span title={`Match en Discover · score ${i.discoverScore}`}
                          style={{ marginLeft: 6, padding: '1px 5px', background: 'var(--ok)', color: 'var(--paper)', fontFamily: 'var(--mono)', fontSize: 9, letterSpacing: '.05em' }}>
                      DS · s{i.discoverScore}
                    </span>
                  )}
                </td>
                {i.seasonTitle && <td style={{ padding: '4px 6px', color: 'var(--ink-3)', fontSize: 10 }}>{i.seasonTitle}</td>}
                {i.cumulativeWeeks != null && i.cumulativeWeeks > 0 && <td style={{ padding: '4px 6px', textAlign: 'right', color: 'var(--ink-4)', fontSize: 10 }}>{i.cumulativeWeeks}w</td>}
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );

  return (
    <div>
      <div style={{ padding: '8px 10px', background: 'var(--paper-3)', border: '1px solid var(--rule)', marginBottom: 12, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)' }}>
        Último poll: <strong style={{ color: 'var(--ink)' }}>{lastPoll ? new Date(lastPoll).toLocaleString('es-ES') : '(nunca)'}</strong> · Netflix {netflixTop.length} · FlixPatrol {flixpatrolTop.length}
        {discoverHitCount > 0 && (
          <span style={{ marginLeft: 8, color: 'var(--ok)' }}>· {discoverHitCount} match(es) en Discover</span>
        )}
      </div>
      {culturalEntityHits.length > 0 && (
        <div style={{ padding: 10, background: 'var(--paper-3)', border: '1px solid var(--ok)', marginBottom: 16, fontFamily: 'var(--mono)', fontSize: 11 }}>
          <div style={{ color: 'var(--ok)', fontWeight: 600, marginBottom: 4 }}>▸ Entidades Discover con contenido en streaming</div>
          {culturalEntityHits.map((h, i) => (
            <div key={i} style={{ color: 'var(--ink-3)', marginTop: 2 }}>
              <strong style={{ color: 'var(--ink)' }}>{h.entity}</strong>
              {' · '}
              {h.hits.map((x, j) => (
                <span key={j} style={{ marginRight: 8 }}>
                  {x.source === 'netflix' ? '🎬' : '📺'} {x.title} (#{x.rank})
                </span>
              ))}
            </div>
          ))}
        </div>
      )}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 20, marginBottom: 20 }}>
        {renderList(nfFilms, 'Netflix Top 10 · Películas ES', 'TSV oficial semanal')}
        {renderList(nfTv, 'Netflix Top 10 · TV ES', 'TSV oficial semanal')}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 20, marginBottom: 20 }}>
        {renderList(fpTv, 'FlixPatrol · Netflix TV ES', 'scraping diario')}
        {renderList(fpMov, 'FlixPatrol · Netflix Movies ES', 'scraping diario')}
      </div>

      {/* Apple Podcasts ES + Steam Top Played */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 20 }}>
        <div>
          <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>
            Apple Podcasts ES<span className="bar"></span>
            <span className="meta">{applePodcastsTop.length} top · Apple Marketing Tools API</span>
          </div>
          {applePodcastsTop.length === 0 ? (
            <div style={{ padding: 8, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)' }}>Sin datos — poll pendiente.</div>
          ) : (
            <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--sans)', fontSize: 12 }}>
              <tbody>
                {applePodcastsTop.slice(0, 20).map(p => (
                  <tr key={p.rank} style={{ borderBottom: '1px solid var(--rule-2)' }}>
                    <td style={{ padding: '4px 6px', width: 32, textAlign: 'right', color: 'var(--accent)', fontWeight: 600 }}>#{p.rank}</td>
                    <td style={{ padding: '4px 6px', width: 40 }}>
                      {p.artworkUrl && <img src={p.artworkUrl} alt="" style={{ width: 32, height: 32, objectFit: 'cover', border: '1px solid var(--rule)', display: 'block' }} />}
                    </td>
                    <td style={{ padding: '4px 6px' }}>
                      <a href={p.url || '#'} target="_blank" rel="noreferrer" style={{ color: 'var(--ink)', textDecoration: 'none', fontWeight: 500 }}>
                        {p.name}
                      </a>
                      {p.artistName && <div style={{ fontSize: 10, color: 'var(--ink-3)', fontFamily: 'var(--mono)' }}>{p.artistName}</div>}
                    </td>
                    {p.genre && <td style={{ padding: '4px 6px', textAlign: 'right', color: 'var(--ink-4)', fontSize: 10 }}>{p.genre}</td>}
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
        <div>
          <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>
            Steam · más jugados<span className="bar"></span>
            <span className="meta">{steamTop.length} top · concurrent peak</span>
          </div>
          {steamTop.length === 0 ? (
            <div style={{ padding: 8, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)' }}>Sin datos — poll pendiente.</div>
          ) : (
            <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--sans)', fontSize: 12 }}>
              <tbody>
                {steamTop.slice(0, 15).map(g => (
                  <tr key={g.rank} style={{ borderBottom: '1px solid var(--rule-2)' }}>
                    <td style={{ padding: '4px 6px', width: 32, textAlign: 'right', color: 'var(--accent)', fontWeight: 600 }}>#{g.rank}</td>
                    <td style={{ padding: '4px 6px', width: 80 }}>
                      {g.headerImage && <img src={g.headerImage} alt="" style={{ width: 72, height: 34, objectFit: 'cover', border: '1px solid var(--rule)', display: 'block' }} />}
                    </td>
                    <td style={{ padding: '4px 6px' }}>
                      <a href={g.url || '#'} target="_blank" rel="noreferrer" style={{ color: 'var(--ink)', textDecoration: 'none', fontWeight: 500 }}>
                        {g.name}
                      </a>
                      <div style={{ fontSize: 10, color: 'var(--ink-3)', fontFamily: 'var(--mono)' }}>
                        peak {g.peakInGame.toLocaleString()}{g.previousRank ? ` · antes #${g.previousRank}` : ''}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

function AemetView() {
  const [state, setState] = useState({ loading: true, data: null, error: null });
  useEffect(() => {
    let alive = true;
    fetch('/api/aemet', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(d => alive && setState({ loading: false, data: d, error: null }))
      .catch(e => alive && setState({ loading: false, data: null, error: e.message }));
    return () => { alive = false; };
  }, []);
  if (state.loading) return <div style={{ padding: 16, fontFamily: 'var(--mono)', color: 'var(--ink-3)' }}>Cargando…</div>;
  if (state.error) return <div style={{ padding: 16, color: 'var(--danger)' }}>Error: {state.error}</div>;
  const { avisos = [], lastPoll, total = 0, byLevel = {}, gaps = 0 } = state.data || {};
  const levelColor = l => l === 'rojo' ? 'var(--danger)' : l === 'naranja' ? '#ff9e2c' : l === 'amarillo' ? 'var(--warn)' : 'var(--ink-4)';
  return (
    <div>
      <div style={{ padding: '8px 10px', background: 'var(--paper-3)', border: '1px solid var(--rule)', marginBottom: 12, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)' }}>
        Último poll: <strong style={{ color: 'var(--ink)' }}>{lastPoll ? new Date(lastPoll).toLocaleString('es-ES') : '(nunca)'}</strong> · total <strong style={{ color: 'var(--ink)' }}>{total}</strong>
        {' · '}
        <span style={{ color: 'var(--danger)' }}>rojo {byLevel.rojo || 0}</span>
        {' · '}
        <span style={{ color: '#ff9e2c' }}>naranja {byLevel.naranja || 0}</span>
        {' · '}
        <span style={{ color: 'var(--warn)' }}>amarillo {byLevel.amarillo || 0}</span>
        {gaps > 0 && (
          <span style={{ marginLeft: 8, color: 'var(--danger)', fontWeight: 600 }}>
            · ⚠ {gaps} aviso(s) severo(s) sin cobertura editorial
          </span>
        )}
      </div>
      {avisos.length === 0 ? (
        <div style={{ padding: 16, fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--ink-4)' }}>
          Sin avisos ahora mismo (o scraping no encontró ninguno). El parser es frágil — revisar si AEMET cambia el markup.
        </div>
      ) : (
        <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--mono)', fontSize: 12 }}>
          <thead>
            <tr style={{ borderBottom: '1px solid var(--rule)' }}>
              <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Nivel</th>
              <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Región</th>
              <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Fenómeno</th>
              <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Cobertura Discover</th>
              <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Vigencia</th>
            </tr>
          </thead>
          <tbody>
            {avisos.map((a, i) => {
              const cc = a.coverageCount || 0;
              const gap = a.coverageGap;
              const coverageLabel = gap
                ? <span style={{ color: 'var(--danger)', fontWeight: 600 }}>⚠ 0 páginas (sever.)</span>
                : cc === 0
                  ? <span style={{ color: 'var(--ink-4)' }}>0</span>
                  : <span style={{ color: 'var(--ok)' }}>{cc} pág.</span>;
              return (
                <tr key={i} style={{ borderBottom: '1px solid var(--rule-2)', background: gap ? 'rgba(255,0,0,.05)' : 'transparent' }}>
                  <td style={{ padding: '6px 8px', color: levelColor(a.level), fontWeight: 600 }}>{a.level}</td>
                  <td style={{ padding: '6px 8px', color: 'var(--ink-2)' }}>{a.region}</td>
                  <td style={{ padding: '6px 8px', color: 'var(--ink)' }}>{a.phenomenon}</td>
                  <td style={{ padding: '6px 8px', fontSize: 11 }}>
                    {coverageLabel}
                    {(a.matchingPages || []).length > 0 && (
                      <div style={{ color: 'var(--ink-4)', marginTop: 2, fontSize: 10 }}>
                        {a.matchingPages.slice(0, 2).map((p, j) => (
                          <a key={j} href={p.url} target="_blank" rel="noreferrer"
                             style={{ display: 'block', color: 'var(--ink-3)', textDecoration: 'none', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 280 }}>
                            ▸ s{p.score} · {p.title.slice(0, 70)}
                          </a>
                        ))}
                      </div>
                    )}
                  </td>
                  <td style={{ padding: '6px 8px', color: 'var(--ink-4)', fontSize: 10, fontFamily: 'var(--mono)' }}>
                    {a.expires ? new Date(a.expires).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '—'}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
    </div>
  );
}

function PredictionsView() {
  const [state, setState] = useState({ loading: true, data: null, error: null });
  const [kindFilter, setKindFilter] = useState('entity');

  useEffect(() => {
    let alive = true;
    fetch('/api/predictions', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(d => { if (alive) setState({ loading: false, data: d, error: null }); })
      .catch(e => { if (alive) setState({ loading: false, data: null, error: e.message }); });
    return () => { alive = false; };
  }, []);

  if (state.loading) return <div style={{ padding: 16, fontFamily: 'var(--mono)', color: 'var(--ink-3)' }}>Calculando predicciones…</div>;
  if (state.error) return <div style={{ padding: 16, color: 'var(--danger)' }}>Error: {state.error}</div>;
  const { summary = {}, predictions = [], targetWeek } = state.data || {};

  const filtered = predictions.filter(p => p.kind === kindFilter);
  const confColor = c => c === 'high' ? 'var(--ok)' : c === 'medium' ? 'var(--warn)' : 'var(--ink-4)';

  const chip = (id, label, count) => (
    <span key={id} onClick={() => setKindFilter(id)}
          style={{
            cursor: 'pointer', padding: '4px 10px', fontFamily: 'var(--mono)', fontSize: 11,
            border: '1px solid var(--rule)', background: kindFilter === id ? 'var(--ink)' : 'transparent',
            color: kindFilter === id ? 'var(--paper)' : 'var(--ink)', marginRight: 6,
          }}>
      {label} <strong>{count}</strong>
    </span>
  );

  const countEnt = predictions.filter(p => p.kind === 'entity').length;
  const countCat = predictions.filter(p => p.kind === 'category').length;
  const countPat = predictions.filter(p => p.kind === 'pattern').length;

  const lowData = (summary.yearsInHistory || []).length < 2;

  return (
    <div>
      <div style={{ display: 'flex', gap: 6, marginBottom: 12, flexWrap: 'wrap' }}>
        {chip('entity', 'Entidades', countEnt)}
        {chip('category', 'Categorías', countCat)}
        {chip('pattern', 'Patrones', countPat)}
      </div>
      <div style={{ padding: '8px 10px', background: 'var(--paper-3)', border: '1px solid var(--rule)', marginBottom: 12, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)' }}>
        Semana target: <strong style={{ color: 'var(--ink)' }}>{targetWeek}</strong> · histórico: {summary.weeksInHistory || 0} semanas · años: {(summary.yearsInHistory || []).join(', ') || '(ninguno previo)'} · {(summary.byConfidence && summary.byConfidence.high) || 0} high-conf · {(summary.byConfidence && summary.byConfidence.medium) || 0} medium · {(summary.byConfidence && summary.byConfidence.low) || 0} low
        {lowData && (
          <div style={{ marginTop: 8, color: 'var(--warn)' }}>
            ⚠ Se necesita al menos 1 año de weeklyHistory acumulado para predicciones fiables. Hoy hay {(summary.yearsInHistory || []).length} año(s) en memoria. Se puede sembrar con backfill de DS histórico (pendiente).
          </div>
        )}
      </div>
      {filtered.length === 0 ? (
        <div style={{ padding: 16, fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--ink-4)' }}>
          Sin predicciones de tipo {kindFilter}. {lowData ? 'Acumulando histórico…' : 'Prueba a bajar el threshold o ampliar tolerance.'}
        </div>
      ) : (
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--mono)', fontSize: 12 }}>
            <thead>
              <tr style={{ borderBottom: '1px solid var(--rule)' }}>
                <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Término</th>
                <th style={{ textAlign: 'right', padding: '6px 8px', color: 'var(--ink-3)' }}>Avg menciones</th>
                <th style={{ textAlign: 'right', padding: '6px 8px', color: 'var(--ink-3)' }}>Años</th>
                <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Confianza</th>
                <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Semanas pasadas</th>
                <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Top feeds</th>
                <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Estado</th>
              </tr>
            </thead>
            <tbody>
              {filtered.slice(0, 60).map((p, i) => (
                <tr key={i} style={{ borderBottom: '1px solid var(--rule-2)' }}>
                  <td style={{ padding: '6px 8px', color: 'var(--ink)' }}>{p.term}</td>
                  <td style={{ padding: '6px 8px', textAlign: 'right', color: 'var(--ink-2)' }}>{p.pastMentionsAvg}</td>
                  <td style={{ padding: '6px 8px', textAlign: 'right', color: 'var(--ink-2)' }}>{p.nYears}</td>
                  <td style={{ padding: '6px 8px', color: confColor(p.confidence) }}>{p.confidence}</td>
                  <td style={{ padding: '6px 8px', color: 'var(--ink-3)', fontSize: 11 }}>{(p.pastWeeks || []).join(', ')}</td>
                  <td style={{ padding: '6px 8px', color: 'var(--ink-3)', fontSize: 11, maxWidth: 240, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{(p.pastTopFeeds || []).join(', ') || '—'}</td>
                  <td style={{ padding: '6px 8px' }}>
                    {p.currentlyHot
                      ? <span style={{ color: 'var(--warn)' }}>ya caliente</span>
                      : <span style={{ color: 'var(--ok)' }}>latente</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function PublishersView() {
  const [state, setState] = useState({ loading: true, data: null, error: null });
  const [filter, setFilter] = useState('notTracked'); // 'notTracked' | 'tracked' | 'all'
  const [q, setQ] = useState('');

  useEffect(() => {
    let alive = true;
    fetch('/api/ds-publishers', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(d => { if (alive) setState({ loading: false, data: d, error: null }); })
      .catch(e => { if (alive) setState({ loading: false, data: null, error: e.message }); });
    return () => { alive = false; };
  }, []);

  if (state.loading) return <div style={{ padding: 16, fontFamily: 'var(--mono)', color: 'var(--ink-3)' }}>Cargando dominios de DiscoverSnoop…</div>;
  if (state.error) return <div style={{ padding: 16, color: 'var(--danger)' }}>Error: {state.error}</div>;
  const { summary = {}, notTracked = [], tracked = [] } = state.data || {};
  let rows = filter === 'tracked' ? tracked : filter === 'all' ? [...notTracked, ...tracked] : notTracked;
  const ql = q.trim().toLowerCase();
  if (ql) rows = rows.filter(r => (r.domain || '').toLowerCase().includes(ql) || (r.sampleTitles || []).some(t => t.toLowerCase().includes(ql)));

  const chip = (id, label, count) => (
    <span key={id} onClick={() => setFilter(id)}
          style={{
            cursor: 'pointer', padding: '4px 10px', fontFamily: 'var(--mono)', fontSize: 11,
            border: '1px solid var(--rule)', background: filter === id ? 'var(--ink)' : 'transparent',
            color: filter === id ? 'var(--paper)' : 'var(--ink)', marginRight: 6,
          }}>
      {label} <strong>{count}</strong>
    </span>
  );

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12, flexWrap: 'wrap' }}>
        {chip('notTracked', 'Sin feed (gap)', summary.notTracked || 0)}
        {chip('tracked', 'Con feed', summary.tracked || 0)}
        {chip('all', 'Todos', (summary.tracked || 0) + (summary.notTracked || 0))}
        <input value={q} onChange={e => setQ(e.target.value)} placeholder="filtrar dominio o título…"
               style={{ marginLeft: 'auto', padding: '4px 8px', fontFamily: 'var(--mono)', fontSize: 11,
                        border: '1px solid var(--rule)', background: 'var(--paper)', color: 'var(--ink)', minWidth: 220 }} />
      </div>
      <div style={{ padding: '8px 10px', background: 'var(--paper-3)', border: '1px solid var(--rule)', marginBottom: 12, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)' }}>
        DS ha visto <strong style={{ color: 'var(--ink)' }}>{(summary.tracked || 0) + (summary.notTracked || 0)}</strong> dominios en el último poll.
        De ellos <strong style={{ color: 'var(--warn)' }}>{summary.notTracked || 0}</strong> no tienen feed todavía — candidatos a sumar en <code>feeds.json</code>.
      </div>
      <div style={{ overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--mono)', fontSize: 12 }}>
          <thead>
            <tr style={{ borderBottom: '1px solid var(--rule)' }}>
              <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Dominio</th>
              <th style={{ textAlign: 'right', padding: '6px 8px', color: 'var(--ink-3)' }}>Pages</th>
              <th style={{ textAlign: 'right', padding: '6px 8px', color: 'var(--ink-3)' }}>Max score</th>
              <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Estado</th>
              <th style={{ textAlign: 'left', padding: '6px 8px', color: 'var(--ink-3)' }}>Titular muestra</th>
            </tr>
          </thead>
          <tbody>
            {rows.slice(0, 200).map(r => (
              <tr key={r.domain} style={{ borderBottom: '1px solid var(--rule-2)' }}>
                <td style={{ padding: '6px 8px' }}>
                  <a href={`https://${r.domain}`} target="_blank" rel="noopener noreferrer" style={{ color: 'var(--ink)' }}>{r.domain}</a>
                </td>
                <td style={{ padding: '6px 8px', textAlign: 'right', color: 'var(--ink-2)' }}>{r.pageCount}</td>
                <td style={{ padding: '6px 8px', textAlign: 'right', color: 'var(--ink-2)' }}>{r.maxScore}</td>
                <td style={{ padding: '6px 8px' }}>
                  {r.tracked
                    ? <span style={{ color: 'var(--ok)' }}>✓ tracked</span>
                    : <span style={{ color: 'var(--warn)' }}>○ sin feed</span>}
                </td>
                <td style={{ padding: '6px 8px', color: 'var(--ink-3)', maxWidth: 440, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {(r.sampleTitles || [])[0] || '—'}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {rows.length > 200 && (
        <div style={{ marginTop: 10, color: 'var(--ink-4)', fontFamily: 'var(--mono)', fontSize: 11 }}>
          Mostrando 200 de {rows.length}. Usa el filtro para acotar.
        </div>
      )}
    </div>
  );
}

function ConfigView({ data }) {
  const totals = data._totals || {};
  const pollers = data.pollers || [];
  const row = (label, value) => (
    <div style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 0', borderBottom: '1px solid var(--rule-2)', fontFamily: 'var(--mono)', fontSize: 12 }}>
      <span style={{ color: 'var(--ink-3)' }}>{label}</span>
      <strong style={{ color: 'var(--ink)' }}>{value}</strong>
    </div>
  );
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 28, marginTop: 14 }}>
      <div>
        <div className="kicker">Pollers <span className="bar"></span></div>
        {pollers.map(p => (
          <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: '1px solid var(--rule-2)', fontFamily: 'var(--mono)', fontSize: 12 }}>
            <span style={{ width: 8, height: 8, borderRadius: '50%', background: p.status === 'ok' ? 'var(--ok)' : 'var(--warn)' }} />
            <strong style={{ minWidth: 120 }}>{p.label}</strong>
            <span style={{ color: 'var(--ink-3)' }}>cada {Math.round(p.cadence / 60)}m</span>
            <span style={{ marginLeft: 'auto', color: 'var(--ink-4)' }}>hace {p.last}s</span>
          </div>
        ))}
      </div>
      <div>
        <div className="kicker">Estado del cache <span className="bar"></span></div>
        {row('Entidades tracked', (totals.entitiesTracked || 0).toLocaleString())}
        {row('Categorías tracked', (totals.categoriesTracked || 0).toLocaleString())}
        {row('Google Trends cacheados', (totals.googleTrendsCached || 0).toLocaleString())}
        {row('X trends cacheados', (totals.xTrendsCached || 0).toLocaleString())}
        {row('Artículos RSS cacheados', (totals.mediaArticlesCached || 0).toLocaleString())}
      </div>
      <div>
        <div className="kicker">Reglas editoriales activas <span className="bar"></span></div>
        {row('Fórmulas con uso últimos 30d', (data.formulas || []).length)}
        {row('Alertas en feed', (data.alerts || []).length)}
        {row('Huecos activos', (data.gaps || []).length)}
        {row('Concordancias', (data.concordances || []).length)}
        {row('Patrones detectados', (data.headlinePatterns || []).length)}
      </div>
      <div>
        <div className="kicker">Endpoints <span className="bar"></span></div>
        <div style={{ fontFamily: 'var(--mono)', fontSize: 11, lineHeight: 1.8, color: 'var(--ink-3)' }}>
          <div><a href="/api/live-alerts" target="_blank" style={{ color: 'var(--accent)' }}>/api/live-alerts</a> — feed + paneles</div>
          <div><a href="/api/historical-discover" target="_blank" style={{ color: 'var(--accent)' }}>/api/historical-discover</a> — histórico DS</div>
          <div><a href="/api/weekly-history" target="_blank" style={{ color: 'var(--accent)' }}>/api/weekly-history</a> — agregado semanal</div>
          <div><a href="/api/feeds" target="_blank" style={{ color: 'var(--accent)' }}>/api/feeds</a> — listado de feeds</div>
          <div><a href="/api/ds-publishers" target="_blank" style={{ color: 'var(--accent)' }}>/api/ds-publishers</a> — dominios DS vs feeds (gap analysis)</div>
          <div><a href="/api/predictions" target="_blank" style={{ color: 'var(--accent)' }}>/api/predictions</a> — predicciones estacionales YoY</div>
          <div><a href="/api/routing" target="_blank" style={{ color: 'var(--accent)' }}>/api/routing</a> — rutas Slack</div>
          <div><a href="/classic.html" target="_blank" style={{ color: 'var(--accent)' }}>/classic.html</a> — dashboard legacy</div>
        </div>
        <div style={{ marginTop: 14, padding: 10, background: 'var(--paper-3)', border: '1px solid var(--rule)', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-3)' }}>
          Edición de thresholds, topics, fórmulas, feeds y routing: por ahora se hace por PR al repo
          (ficheros <code>topics.json</code>, <code>headline-formulas.json</code>, <code>routing.json</code>, <code>feeds.json</code>).
          Siguiente iteración: editores inline y <code>PATCH</code> a Upstash con override runtime.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
