const D = window.DA_DATA;

/* ---------------- Theme switch ---------------- */
// ─── Importados (LocalStorage) ───────────────────────────────────────────
// Material que el redactor marca para llevarse a Claude/ChatGPT. Persistente
// por dispositivo. Estructura: { news: [{id,...}], patterns: [{id,...}] }
const IMPORTS_KEY = 'ed-imports-v1';
function loadImports() {
  try {
    const raw = localStorage.getItem(IMPORTS_KEY);
    if (!raw) return { news: [], patterns: [] };
    const j = JSON.parse(raw);
    return { news: Array.isArray(j.news) ? j.news : [], patterns: Array.isArray(j.patterns) ? j.patterns : [] };
  } catch { return { news: [], patterns: [] }; }
}
function saveImports(imp) {
  try { localStorage.setItem(IMPORTS_KEY, JSON.stringify(imp)); } catch {}
  // Disparamos un event para que cualquier componente con useImports se entere
  window.dispatchEvent(new Event('ed-imports-changed'));
}
function useImports() {
  const [imp, setImp] = useState(loadImports());
  useEffect(() => {
    const handler = () => setImp(loadImports());
    window.addEventListener('ed-imports-changed', handler);
    window.addEventListener('storage', handler);
    return () => {
      window.removeEventListener('ed-imports-changed', handler);
      window.removeEventListener('storage', handler);
    };
  }, []);
  const addNews = (item) => {
    const cur = loadImports();
    if (cur.news.find(n => n.id === item.id)) return; // dedupe
    cur.news.unshift({ ...item, importedAt: new Date().toISOString() });
    saveImports(cur);
  };
  const addPattern = (item) => {
    const cur = loadImports();
    if (cur.patterns.find(p => p.id === item.id)) return;
    cur.patterns.unshift({ ...item, importedAt: new Date().toISOString() });
    saveImports(cur);
  };
  const removeNews = (id) => {
    const cur = loadImports();
    cur.news = cur.news.filter(n => n.id !== id);
    saveImports(cur);
  };
  const removePattern = (id) => {
    const cur = loadImports();
    cur.patterns = cur.patterns.filter(p => p.id !== id);
    saveImports(cur);
  };
  const clearAll = () => saveImports({ news: [], patterns: [] });
  return { imp, addNews, addPattern, removeNews, removePattern, clearAll };
}

function ThemeSwitch() {
  const [active, setActive] = useState(document.body.dataset.theme || 'light');
  const themes = [
    { id: 'light', label: 'Claro' },
    { id: 'dark', label: 'Oscuro' },
    { id: 'terminal', label: 'Terminal' },
  ];
  const pick = (id) => {
    document.body.dataset.theme = id;
    try { localStorage.setItem('da.theme', id); } catch (e) {}
    setActive(id);
  };
  useEffect(() => {
    try {
      const saved = localStorage.getItem('da.theme');
      if (saved) { document.body.dataset.theme = saved; setActive(saved); }
    } catch (e) {}
  }, []);
  return (
    <div className="theme-switch" style={{ display: 'inline-flex', gap: 4, marginLeft: 12 }}>
      {themes.map(t => (
        <span key={t.id}
              onClick={() => pick(t.id)}
              title={`Tema: ${t.label}`}
              style={{
                cursor: 'pointer',
                fontFamily: 'var(--mono)',
                fontSize: 9,
                letterSpacing: '0.08em',
                textTransform: 'uppercase',
                padding: '2px 6px',
                border: '1px solid ' + (active === t.id ? 'var(--ink)' : 'var(--rule)'),
                background: active === t.id ? 'var(--ink)' : 'transparent',
                color: active === t.id ? 'var(--paper)' : 'var(--ink-3)',
                borderRadius: 2,
              }}>
          {t.label.slice(0, 3)}
        </span>
      ))}
    </div>
  );
}

/* ---------------- Masthead ---------------- */
function Masthead({ activeNav, setActiveNav, clock, counts = {}, instance = {} }) {
  // Tabs irrelevantes para instancias verticales (sport, etc.) — se ocultan
  // si DS_CATEGORY_FILTER está activo. El polling tampoco rellena estos
  // datos en ese caso.
  const verticalHidden = instance.vertical
    ? new Set(['sucesos', 'boe', 'cultural', 'aemet'])
    : new Set();
  // 'Audita texto' e 'Importados' son features internas de la instancia
  // sport (curso IA ED). En main no se ofrece la pestaña ni se rutea la URL.
  if (instance.name !== 'sport') {
    verticalHidden.add('auditor-texto');
    verticalHidden.add('importados');
    verticalHidden.add('produccion-discover');
    verticalHidden.add('mundial');
  }
  const navs = [
    { id: 'feed', label: 'Feed en vivo', count: counts.feed },
    { id: 'huecos', label: 'Huecos', count: counts.huecos },
    { id: 'sucesos', label: 'Sucesos', count: counts.sucesos },
    { id: 'boe', label: 'BOE', count: counts.boe },
    { id: 'trends', label: 'Google Trends', count: counts.trends },
    { id: 'xtrends', label: 'X/Twitter', count: counts.xtrends },
    { id: 'entidades', label: 'Entidades', count: counts.entidades },
    { id: 'categorias', label: 'Categorías DS', count: counts.categorias },
    { id: 'medios', label: 'Medios' },
    { id: 'publishers', label: 'Publishers DS', count: counts.publishers },
    { id: 'internacional', label: 'Internacional' },
    { id: 'competidores', label: 'Competidores' },
    { id: 'formulas', label: 'Fórmulas' },
    { id: 'patrones', label: 'Patrones' },
    { id: 'patrones-categoria', label: 'Patrones · Categoría' },
    { id: 'datacategoria', label: 'Datacategoría' },
    { id: 'mundial', label: 'Mundial' },
    { id: 'auditor', label: 'Auditor titular' },
    { id: 'auditor-texto', label: 'Audita texto' },
    { id: 'produccion-discover', label: 'Producción / Discover' },
    { id: 'importados', label: 'Importados' },
    { id: 'kg', label: 'Knowledge Graph' },
    { id: 'historico', label: 'Histórico' },
    { id: 'predicciones', label: 'Predicciones' },
    { id: 'cultural', label: 'Cultural' },
    { id: 'aemet', label: 'AEMET' },
    { id: 'configuracion', label: 'Config' },
  ].filter(n => !verticalHidden.has(n.id));
  const fmtDate = clock.toLocaleDateString('es-ES', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  const fmtTime = clock.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  return (
    <header className="masthead">
      <div className="masthead-row">
        <div className="wordmark">
          <span className="dot"></span>
          DISCOVER<span style={{ color: 'var(--accent)' }}>·</span>ALERTS
        </div>
        <div className="datetime">
          <span>{fmtDate.toUpperCase()}</span>
          <span>·</span>
          <span>{fmtTime} CET</span>
          <span className="live">LIVE</span>
          <ThemeSwitch />
        </div>
      </div>
      <nav className="masthead-nav">
        {navs.map(n => (
          <div key={n.id}
               className={cx('nav-item', activeNav === n.id && 'active')}
               onClick={() => setActiveNav(n.id)}>
            {n.label}
            {n.count ? <span className="count">{n.count}</span> : null}
          </div>
        ))}
      </nav>

  );
}

/* ---------------- Pollers status ---------------- */
function Pollers({ pollers }) {
  return (
    <div className="pollers">
      <span style={{ color: 'var(--ink-4)', marginRight: 4 }}>Fuentes</span>
      {pollers.map(p => (
        <div key={p.id} className={cx('poller', p.status !== 'ok' && p.status)}>
          <span className="pill"></span>
          <span className="label">{p.label}</span>
          <span className="t">· {p.last > 0 ? `${p.last}s · ` : ''}cada {Math.round(p.cadence/60)}m</span>
        </div>
      ))}
    </div>
  );
}

/* ---------------- Ticker ---------------- */
function Ticker({ data }) {
  const items = useMemo(() => {
    const out = [];
    // Top entities por velocity (rising/peaking)
    for (const e of (data.entities || []).slice(0, 6)) {
      const up = e.trend === 'up';
      const label = e.trend === 'up' ? (e.delta || '↑') : e.trend === 'down' ? (e.delta || '↓') : e.delta || '—';
      out.push({ t: e.name, v: label, up });
    }
    // Top trends por traffic
    for (const t of (data.trends || []).slice(0, 4)) {
      out.push({ t: t.title, v: `~${(t.traffic || 0).toLocaleString()}+`, up: true });
    }
    // Huecos activos
    for (const g of (data.gaps || []).slice(0, 3)) {
      out.push({ t: g.entity, v: `hueco · ${g.kind}`, up: true });
    }
    return out.length > 0 ? out : [{ t: 'Esperando primer poll', v: '…', up: true }];
  }, [data.entities, data.trends, data.gaps]);

  const row = (k) => (
    <React.Fragment key={k}>
      {items.map((it, i) => (
        <span key={i} className="ticker-item">
          <strong>{it.t}</strong><span className="sep">▸</span>
          <span className={it.up ? 'up' : 'dn'}>{it.v}</span>
        </span>
      ))}
    </React.Fragment>
  );
  return (
    <div className="ticker">
      <div className="ticker-label">LIVE</div>
      <div className="ticker-track">
        <div className="ticker-move">{row('a')}{row('b')}</div>
      </div>
    </div>
  );
}

/* ---------------- Filter bar ---------------- */
function FilterBar({ filter, setFilter, counts }) {
  // Chip especial "own_media" agrupa own_media + own_media_absent.
  // El matching de filter es por prefijo cuando id termina en ':*'.
  // Counts agregados: agrupar tipos relacionados (entity subtypes, trends_*, schemas)
  const sumKeys = (...keys) => keys.reduce((a, k) => a + (counts[k] || 0), 0);
  // id 'group:k1+k2+k3' permite agrupar varios types en un mismo chip.
  const chips = [
    { id: 'all', label: 'Todas', c: counts.all },
    { id: 'group:own_media+own_media_absent', label: 'Own media', c: sumKeys('own_media','own_media_absent'), style: 'own-media' },
    { id: 'group:flash+longtail+ascending+rising+discover_1h+discover_3h+discover_12h+discover_page', label: 'Discover', c: sumKeys('flash','longtail','ascending','rising','discover_1h','discover_3h','discover_12h','discover_page') },
    { id: 'group:trends_new_topic+trends_correlation+trends_news', label: 'Trends', c: sumKeys('trends_new_topic','trends_correlation','trends_news') },
    { id: 'schema_news_match', label: 'Sucesos/Legal', c: counts.schema_news_match },
    { id: 'meneame_hot', label: 'Menéame hot', c: counts.meneame_hot },
    { id: 'wikipedia_surge', label: 'Wikipedia surge', c: counts.wikipedia_surge },
    { id: 'first_mover', label: 'First mover', c: counts.first_mover },
    { id: 'headline_cluster', label: 'Cluster titular', c: counts.headline_cluster },
    { id: 'coverage_join', label: 'Cobertura', c: counts.coverage_join },
    { id: 'trends_without_discover', label: 'Hueco SEO', c: counts.trends_without_discover },
    { id: 'triple_match', label: 'Triple match', c: counts.triple_match },
  ].filter(c => c.id === 'all' || c.c > 0);
  return (
    <div className="filter-bar">
      {chips.map(c => (
        <span key={c.id}
              className={cx('chip', filter === c.id && 'active', c.style === 'own-media' && 'chip-own-media')}
              onClick={() => setFilter(c.id)}>
          {c.label}{c.c != null ? <span className="c">{c.c}</span> : null}
        </span>
      ))}
      <span style={{ marginLeft: 'auto', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)', letterSpacing: '0.06em' }}>
        ORDEN · <strong style={{ color: 'var(--ink)' }}>TIEMPO REAL</strong> · <span>SCORE</span> · <span>VELOCIDAD</span>
      </span>
    </div>
  );
}

/* ---------------- Drawer detail ---------------- */
function Drawer({ alert, onClose, data }) {
  if (!alert) return null;

  // Enriquecimiento: primero probamos a resolver por entidad. Si no hay match,
  // caemos al resolver por TIPO (category, trends_*, headline_pattern, etc.)
  // para rellenar SIEMPRE la tarjeta con contexto relevante, no solo cuando
  // hay entidad asociada.
  const raw = (data && data._raw) || {};
  const ent = alert.entity && alert.entity !== '—'
    ? (raw.entities || []).find(e => e.name === alert.entity)
    : null;

  // Resolver por tipo cuando no hay entidad
  let typeContext = null;
  const alertType = alert.type || '';
  // Category alert → busca en data._raw.categories por nombre
  if (!ent && (alertType === 'category' || /^\/.+/.test(alert.headline || ''))) {
    const name = alert.headline || alert.category;
    const cat = (raw.categories || []).find(c => c.name === name || c.name === alert.category);
    if (cat) typeContext = { kind: 'category', cat };
  }
  // Trends-related alert → busca en raw.trends (depende de adapter, puede estar en raw o _raw)
  if (!ent && !typeContext && (alertType.startsWith('trends_') || /trend/i.test(alertType))) {
    // raw.trends shape puede ser Record<title, snap> (desde state directamente)
    const trendTitle = alert.headline || alert.entity;
    const trendsData = raw.trends || {};
    let trend = null;
    if (trendsData[trendTitle]) trend = { title: trendTitle, ...trendsData[trendTitle] };
    else {
      // buscar substring match
      for (const [t, snap] of Object.entries(trendsData)) {
        if (t.toLowerCase().includes(String(trendTitle).toLowerCase()) || String(trendTitle).toLowerCase().includes(t.toLowerCase())) {
          trend = { title: t, ...(snap || {}) };
          break;
        }
      }
    }
    if (trend) typeContext = { kind: 'trend', trend };
  }
  // Headline pattern → el title suele ser el ngram
  if (!ent && !typeContext && alertType === 'headline_pattern') {
    const ngram = alert.headline;
    const patterns = raw.headlinePatterns || [];
    const pat = patterns.find(p => p.ngram === ngram);
    if (pat || ngram) typeContext = { kind: 'headline_pattern', ngram, pattern: pat };
  }

  // Fallback search: si no hay topPages del ent, buscar en raw.pagesSlim por substring.
  function searchSlimPages(query) {
    if (!query) return [];
    const q = String(query).toLowerCase();
    if (q.length < 3) return [];
    return (raw.pagesSlim || [])
      .filter(p => (p.title || '').toLowerCase().includes(q))
      .slice(0, 5);
  }
  function searchSlimArticles(query) {
    if (!query) return [];
    const q = String(query).toLowerCase();
    if (q.length < 3) return [];
    return (raw.mediaArticlesSlim || [])
      .filter(a => (a.title || '').toLowerCase().includes(q))
      .slice(0, 10);
  }

  let topPages = (ent && ent.topPages) || (typeContext?.kind === 'category' ? (typeContext.cat.topPages || []) : []);
  if (topPages.length === 0 && alert.entity && alert.entity !== '—') {
    topPages = searchSlimPages(alert.entity);
  }
  let matchingArticles = (ent && ent.matchingArticles) || [];
  if (matchingArticles.length === 0 && alert.entity && alert.entity !== '—') {
    matchingArticles = searchSlimArticles(alert.entity).map(a => ({ title: a.title, link: a.link, feedName: a.feedName }));
  }
  const googleTrends = (ent && ent.matchingGoogleTrends) || [];
  const xTrends = (ent && ent.matchingXTrends) || [];
  // Si alert.examples viene vacío y tenemos matchingArticles del fallback, usar esos como enlaces
  const examples = (alert.examples && alert.examples.length > 0)
    ? alert.examples
    : (matchingArticles.slice(0, 4).map(a => ({ title: a.title, url: a.link, source: a.feedName })));
  const topImage = (topPages.find(p => p.image) || {}).image || alert.imageUrl;
  // Entidades relacionadas: misma categoría, mismo topic, o entidades del typeContext
  const related = ent
    ? (raw.entities || [])
        .filter(e => e.name !== ent.name && (
          (ent.category && e.category === ent.category) ||
          (ent.topic && e.topic === ent.topic)
        ))
        .slice(0, 8)
    : (typeContext?.kind === 'category' ? (typeContext.cat.topEntities || []).slice(0, 12) : []);

  return (
    <>
      <div className={cx('drawer-backdrop', alert && 'open')} onClick={onClose}></div>
      <aside className={cx('drawer', alert && 'open')}>
        <button className="drawer-close" onClick={onClose}>ESC · cerrar</button>
        <div className="drawer-inner">
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 6 }}>
            <Tag kind="accent">{alert.typeLabel}</Tag>
            {alert.category && alert.category !== '—' && <Tag kind="ghost">{alert.category}</Tag>}
            {ent && ent.topic && <Tag kind="accent">{ent.topic}</Tag>}
            <VelocityBadge velocity={alert.velocity} ratio={alert.velocityRatio} />
          </div>
          <h1>{alert.headline}</h1>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)', letterSpacing: '0.04em', marginBottom: 4 }}>
            {alert.ts} · {alert.ago} · entidad ▸ <strong style={{ color: 'var(--ink)' }}>{alert.entity}</strong>
            {ent && ent.firstSeen && (
              <span style={{ marginLeft: 8, color: 'var(--accent)' }}>
                · en Discover desde {(() => {
                  const diffH = (Date.now() - new Date(ent.firstSeen).getTime()) / 3600_000;
                  if (diffH < 1) return `${Math.round(diffH * 60)}m`;
                  if (diffH < 24) return `${Math.round(diffH)}h`;
                  return `${Math.round(diffH / 24)}d`;
                })()}
              </span>
            )}
          </div>
          <p style={{ fontFamily: 'var(--serif)', fontSize: 15, lineHeight: 1.5, color: 'var(--ink-2)', margin: '10px 0 4px' }}>{alert.snippet}</p>

          {/* Knowledge Graph enrichment de la entidad principal */}
          {(() => {
            const kgMap = (raw && raw.entityKgEnrichment) || {};
            const kg = alert.entity ? kgMap[alert.entity] : null;
            if (!kg || kg.notFound) return null;
            const typeBadge = {
              Person: { c: 'var(--ok)', label: '👤 Persona' },
              Organization: { c: 'var(--accent)', label: '🏢 Organización' },
              Place: { c: 'var(--warn)', label: '📍 Lugar' },
              Event: { c: '#7B61FF', label: '📅 Evento' },
              Work: { c: '#FF6B6B', label: '🎬 Obra' },
              Other: { c: 'var(--ink-3)', label: '◯ Otro' },
            }[kg.type || 'Other'];
            return (
              <div style={{ padding: '10px 12px', background: 'var(--paper-3)', border: '1px solid var(--rule-2)', marginTop: 10, marginBottom: 4 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 9, padding: '2px 6px', background: typeBadge.c, color: 'var(--paper)', letterSpacing: '.05em', textTransform: 'uppercase' }}>
                    {typeBadge.label}
                  </span>
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)' }}>knowledge graph</span>
                </div>
                {kg.description && (
                  <div style={{ fontFamily: 'var(--sans)', fontSize: 13, color: 'var(--ink-2)', lineHeight: 1.4, marginBottom: 6 }}>{kg.description}</div>
                )}
                {(kg.aliases || []).length > 0 && (
                  <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)', marginBottom: 6 }}>
                    también conocida como: {kg.aliases.slice(0, 3).join(', ')}
                  </div>
                )}
                {(kg.relations || []).length > 0 && (
                  <div style={{ marginBottom: 8 }}>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--ink-4)', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 3 }}>Relaciones KG</div>
                    {kg.relations.slice(0, 6).map((r, i) => (
                      <div key={i} style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)', lineHeight: 1.4 }}>
                        <span style={{ color: 'var(--ink-4)' }}>{r.label}:</span>{' '}
                        <a href={`https://www.wikidata.org/wiki/${r.targetQid}`} target="_blank" rel="noreferrer"
                           style={{ color: 'var(--ink)', textDecoration: 'none' }}>
                          {r.targetName}
                        </a>
                      </div>
                    ))}
                  </div>
                )}
                <div style={{ display: 'flex', gap: 8, fontFamily: 'var(--mono)', fontSize: 10 }}>
                  {kg.wdId && <a href={`https://www.wikidata.org/wiki/${kg.wdId}`} target="_blank" rel="noreferrer" style={{ color: 'var(--accent)' }}>Wikidata {kg.wdId}</a>}
                  {kg.wikipediaEs && <a href={kg.wikipediaEs} target="_blank" rel="noreferrer" style={{ color: 'var(--accent)' }}>Wikipedia ES</a>}
                  {kg.wikipediaEn && <a href={kg.wikipediaEn} target="_blank" rel="noreferrer" style={{ color: 'var(--accent)' }}>Wikipedia EN</a>}
                </div>
              </div>
            );
          })()}

          <div className="drawer-section">
            <h3>Señales de esta alerta</h3>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>
              <div>

/* ---------------- Tweaks ---------------- */
function Tweaks({ tweaks, setTweak, visible }) {
  if (!visible) return null;
  const accents = [
    { v: '#D9342B', name: 'red' },
    { v: '#E55A12', name: 'orange' },
    { v: '#1F8A4C', name: 'green' },
    { v: '#1C5BB0', name: 'blue' },
    { v: '#8B2FC9', name: 'viral' },
    { v: '#0C0C0D', name: 'ink' },
  ];
  return (
    <div className="tweaks">
      <h4>TWEAKS</h4>
      <div className="tweak-row">
        <label>Tema</label>
        <div className="seg">
          <button className={tweaks.theme === 'light' ? 'active' : ''} onClick={() => setTweak('theme','light')}>Claro</button>
          <button className={tweaks.theme === 'dark' ? 'active' : ''} onClick={() => setTweak('theme','dark')}>Oscuro</button>
          <button className={tweaks.theme === 'terminal' ? 'active' : ''} onClick={() => setTweak('theme','terminal')}>Terminal</button>
        </div>
      </div>
      <div className="tweak-row">
        <label>Densidad</label>
        <div className="seg">
          <button className={tweaks.density === 'compact' ? 'active' : ''} onClick={() => setTweak('density','compact')}>Compacto</button>
          <button className={tweaks.density === 'dense' ? 'active' : ''} onClick={() => setTweak('density','dense')}>Denso</button>
          <button className={tweaks.density === 'comfy' ? 'active' : ''} onClick={() => setTweak('density','comfy')}>Cómodo</button>
        </div>
      </div>
      <div className="tweak-row">
        <label>Acento</label>
        <div className="swatches">
          {accents.map(a => (
            <div key={a.v}
                 className={cx('swatch', tweaks.accent === a.v && 'active')}
                 style={{ background: a.v }}
                 onClick={() => setTweak('accent', a.v)} />
          ))}
        </div>
      </div>
      <div className="tweak-row">
        <label>Ticker breaking</label>
        <div className="seg">
          <button className={tweaks.showTicker ? 'active' : ''} onClick={() => setTweak('showTicker', true)}>On</button>
          <button className={!tweaks.showTicker ? 'active' : ''} onClick={() => setTweak('showTicker', false)}>Off</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [clock, setClock] = useState(new Date());
  const [activeNav, setActiveNav] = useState('feed');
  const [filter, setFilter] = useState('all');
  const [openAlert, setOpenAlert] = useState(null);
  const [freshId, setFreshId] = useState(null);
  // Estado único con toda la data del dashboard. Arranca con el mock de
  // fallback (data.js) y se sobreescribe con la respuesta real de /api/live-alerts.
  const [data, setData] = useState(window.DA_DATA || {});
  const alerts = data.alerts || [];
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [loaded, setLoaded] = useState(false);

  /* Apply tweaks to :root + body (no pisar theme del ThemeSwitch si ya hay localStorage) */
  useEffect(() => {
    document.body.dataset.density = tweaks.density;
    let savedTheme = null;
    try { savedTheme = localStorage.getItem('da.theme'); } catch (e) {}
    if (!savedTheme) {
      document.body.dataset.theme = tweaks.theme;
    }
    document.documentElement.style.setProperty('--accent', tweaks.accent);
    document.documentElement.style.setProperty('--accent-deep', tweaks.accent);
  }, [tweaks]);

  /* live clock */
  useEffect(() => {
    const i = setInterval(() => setClock(new Date()), 1000);
    return () => clearInterval(i);
  }, []);

  /* Fetch real data + refresh cada 60s */
  useEffect(() => {
    let cancelled = false;
    async function load() {
      if (typeof window.refreshDashboardData !== 'function') return;
      const mapped = await window.refreshDashboardData();
      if (cancelled) return;
      if (mapped) {
        setData(mapped);
        setLoaded(true);
        // Aplicar tema de instancia (sport, etc.) si la API lo declara
        try {
          const inst = mapped._raw && mapped._raw.instance;
          if (inst && inst.name && inst.name !== 'main') {
            document.body.setAttribute('data-instance', inst.name);
          }
        } catch (e) { /* noop */ }
      }
    }
    load();
    const i = setInterval(load, 60_000);
    const onUpd = () => {
      if (window.DA_DATA) setData(window.DA_DATA);
    };
    window.addEventListener('da-data-updated', onUpd);
    return () => { cancelled = true; clearInterval(i); window.removeEventListener('da-data-updated', onUpd); };
  }, []);

  /* ESC closes drawer */
  useEffect(() => {
    const h = (e) => { if (e.key === 'Escape') setOpenAlert(null); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  /* Edit mode protocol */
  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setTweak = (k, v) => {
    setTweaks(prev => {
      const next = { ...prev, [k]: v };
      try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*'); } catch(e){}
      return next;
    });
  };

  /* Filter alerts:
   *   'all'           → todas
   *   'group:a+b+c'   → tipos en lista
   *   'foo:*'         → prefix match (legacy)
   *   'foo'           → exact type match
   */
  const filtered = useMemo(() => {
    if (filter === 'all') return alerts;
    if (filter.startsWith('group:')) {
      const types = new Set(filter.slice(6).split('+'));
      return alerts.filter(a => types.has(a.type));
    }
    if (filter.endsWith(':*')) {
      const prefix = filter.slice(0, -2);
      return alerts.filter(a => (a.type || '').startsWith(prefix));
    }
    return alerts.filter(a => a.type === filter);
  }, [alerts, filter]);
  const counts = useMemo(() => {
    const c = { all: alerts.length };
    for (const a of alerts) c[a.type] = (c[a.type] || 0) + 1;
    return c;
  }, [alerts]);

  const kicker = (label, meta) => (
    <>
      <div className="kicker">{label} <span className="bar"></span>{meta ? <span className="meta">{meta}</span> : null}</div>
    </>
  );

  const schemaNews = (data._raw && data._raw.schemaNews) || {};
  const sucNews = schemaNews.sucesos || [];
  const legNews = schemaNews.legal || [];

  const viewFeed = (
    <>
      <section className="main">
        {kicker('Feed en vivo', `${filtered.length} alertas · orden por tiempo · actualiza cada 60s${loaded ? '' : ' · cargando…'}`)}
        <FilterBar filter={filter} setFilter={setFilter} counts={counts} />
        {(sucNews.length > 0 || legNews.length > 0) && (
          <SchemaNewsBlock sucesos={sucNews} legal={legNews} />
        )}
        {filtered.map(a => (
          <AlertRow key={a.id} alert={a} fresh={freshId === a.id} onOpen={setOpenAlert} />
        ))}
        {filtered.length === 0 && (
          <div style={{ padding: '32px 0', textAlign: 'center', fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)' }}>
            Sin alertas con este filtro. Prueba otro tipo o espera al próximo poll.
          </div>
        )}
        <div style={{ padding: '18px 0', textAlign: 'center', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)', letterSpacing: '0.08em' }}>
          — {loaded ? 'DATOS EN VIVO' : 'CARGANDO DATOS'} · REFRESCO AUTOMÁTICO CADA 60s —
        </div>
      </section>
      <aside className="side">

            cursor: 'pointer', padding: '4px 10px', fontFamily: 'var(--mono)', fontSize: 11,

        <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)', padding: 8 }}>

        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 4, maxHeight: expanded ? 480 : 'none', overflowY: expanded ? 'auto' : 'visible' }}>

              <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: n.kind === 'ds' ? 'var(--accent)' : 'var(--ink-4)', flexShrink: 0, minWidth: 30, paddingTop: 2 }}>
                {n.kind === 'ds' ? 'DS' : 'RSS'}

              <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-3)', flexShrink: 0, minWidth: 120, paddingTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {n.source}
              </span>
              <span style={{ flex: 1, fontSize: 13, color: 'var(--ink)', lineHeight: 1.35 }}>
                {n.title}
              </span>
              <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: accentColor, flexShrink: 0, paddingTop: 2 }}>
                {(n.keywords || []).slice(0, 2).join(' · ')}
              </span>
            </a>
          ))}
          {items.length > SAMPLE_SIZE && (
            <div style={{ marginTop: 6, padding: '4px 8px', textAlign: 'center' }}>
              <span onClick={() => setExpanded(!expanded)}
                    style={{ cursor: 'pointer', fontFamily: 'var(--mono)', fontSize: 11, letterSpacing: '.05em', color: accentColor, padding: '4px 12px', border: `1px solid ${accentColor}`, display: 'inline-block' }}>

                 (e.category || '').toLowerCase().includes('sensitive'))
    .slice(0, 20);

  const alerts = (raw.recentAlerts || [])
    .filter(r => (r.topic === 'sucesos') || (r.alert && r.alert.topic === 'sucesos'))
    .slice(0, 30);
  // Huecos con topic=sucesos
  const gaps = (raw.opportunities || [])
    .filter(o => (o.topic || '').toLowerCase() === 'sucesos')
    .slice(0, 10);

    <div key={key}
         onClick={() => onOpenAlert && onOpenAlert(null)}
         style={{
           padding: 'var(--space-5) 0',
           borderBottom: '1px solid var(--rule-2)',
           fontFamily: 'var(--sans)',
           fontSize: 'var(--text-base)',
         }}>
      <div style={{ fontWeight: 700, color: 'var(--ink)', marginBottom: 'var(--space-1)' }}>

      <div style={{ fontFamily: 'var(--mono)', fontSize: 'var(--text-sm)', color: 'var(--ink-3)' }}>

      marginTop: 'var(--space-7)',
      padding: 'var(--space-8) var(--space-9)',
      border: '2px solid var(--warn)',
      background: 'rgba(232, 145, 0, 0.04)',
    }}>
      <div style={{ marginBottom: 'var(--space-8)', fontFamily: 'var(--mono)', fontSize: 'var(--text-xs)', color: 'var(--warn)', letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 700 }}>

      </p>

      {!hasSignal && (
        <div style={{ padding: 'var(--space-10)', textAlign: 'center', fontFamily: 'var(--mono)', fontSize: 'var(--text-sm)', color: 'var(--ink-4)' }}>
          Sin señal de sucesos activa en este momento.<br/>
          El clasificador sigue vigilando (keywords: asesinato, tiroteo, guardia civil, desaparecido, atraco…).
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 'var(--space-10)' }}>
        {gaps.length > 0 && (
          <div>
            <div className="kicker">Huecos sucesos <span className="bar"></span> <span className="meta">{gaps.length} activos</span></div>
            {gaps.map((g, i) => row({
              title: g.title,
              detail: `${(g.kind || '').replace('_', ' ')} · ${g.detail || ''}`,

        {alerts.length > 0 && (
          <div>
            <div className="kicker">Alertas recientes <span className="bar"></span> <span className="meta">últimas 6h · topic=sucesos</span></div>

                            {p.source || ''}

                          <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>

                          </span>
                        </a>
                      ))}
                    </div>
                  );
                })()}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );

/* ---------------- BOE view (disposiciones oficiales hoy) ---------------- */
function BoeView({ boe, rawEntities }) {
  if (!boe) {
    return (
      <div style={{ padding: 'var(--space-10)', textAlign: 'center', fontFamily: 'var(--mono)', fontSize: 'var(--text-sm)', color: 'var(--ink-4)' }}>
        Cargando BOE…
      </div>
    );
  }
  if (boe.totalItems === 0) {
    return (
      <div style={{ padding: 'var(--space-10)', textAlign: 'center', fontFamily: 'var(--mono)', fontSize: 'var(--text-sm)', color: 'var(--ink-4)' }}>
        Hoy no se publica BOE (domingo o festivo).<br/>
        Próxima publicación: siguiente día hábil a las 07:00.
      </div>
    );
  }

  // Normalizar nombres de entidades para cruzar con los items BOE
  const entityNorms = (rawEntities || [])
    .filter(e => e.name && e.name.length > 4)
    .map(e => ({ name: e.name, norm: e.name.toLowerCase() }));

  // Crossmatch: para cada item BOE, ver si contiene alguna entidad Discover
  const crossmatch = (title) => {
    const lo = (title || '').toLowerCase();
    return entityNorms.filter(e => lo.includes(e.norm)).map(e => e.name).slice(0, 3);
  };

  return (
    <div style={{ marginTop: 'var(--space-7)' }}>
      <div style={{
        padding: 'var(--space-5) var(--space-8)',
        marginBottom: 'var(--space-9)',
        background: 'var(--paper-3)',
        borderLeft: '3px solid var(--info)',
        fontFamily: 'var(--sans)',
        fontSize: 'var(--text-base)',
        color: 'var(--ink-2)',
        lineHeight: 1.5,
      }}>
        <strong>BOE — Boletín Oficial del Estado.</strong> Disposiciones publicadas hoy,
        agrupadas por sección. Fuente primaria editorial: normativa + nombramientos +
        subvenciones + anuncios. Ventaja: lo leemos antes que se escriba sobre ello en
        medios (media 15-60 min).
      </div>

      {(boe.sections || []).map((sec, si) => (
        <div key={si} style={{ marginBottom: 'var(--space-10)' }}>
          <div className="kicker" style={{ marginBottom: 'var(--space-5)' }}>
            {sec.name}
            <span className="bar"></span>
            <span className="meta">{sec.count} disposiciones</span>
          </div>
          {sec.items.map((it, ii) => {
            const matches = crossmatch(it.titulo || '');
            return (
              <div key={ii} style={{
                padding: 'var(--space-5) 0',
                borderBottom: '1px solid var(--rule-2)',
              }}>
                <div style={{
                  fontFamily: 'var(--mono)',
                  fontSize: 'var(--text-2xs)',
                  color: 'var(--ink-4)',
                  letterSpacing: '0.08em',
                  textTransform: 'uppercase',
                  marginBottom: 'var(--space-1)',
                }}>
                  {it.departamento} · {it.epigrafe}
                </div>
                <div style={{
                  fontFamily: 'var(--serif)',
                  fontSize: 'var(--text-lg)',
                  fontWeight: 600,
                  color: 'var(--ink)',
                  lineHeight: 1.35,
                  marginBottom: 'var(--space-3)',
                }}>
                  {it.titulo}
                </div>
                <div style={{ display: 'flex', gap: 'var(--space-5)', alignItems: 'center', flexWrap: 'wrap' }}>
                  {matches.length > 0 && (
                    <span style={{
                      fontFamily: 'var(--mono)',
                      fontSize: 'var(--text-xs)',
                      color: 'var(--accent)',
                      fontWeight: 700,
                      letterSpacing: '0.06em',
                      textTransform: 'uppercase',
                    }}>
                      ✓ Cruza con Discover: {matches.join(', ')}
                    </span>
                  )}
                  {it.urlHtml && (
                    <a href={it.urlHtml} target="_blank" rel="noreferrer"
                       style={{ fontFamily: 'var(--mono)', fontSize: 'var(--text-xs)', color: 'var(--ink-3)', textDecoration: 'none' }}>
                      ↗ Ver en BOE
                    </a>
                  )}
                  {it.urlPdf && (
                    <a href={it.urlPdf} target="_blank" rel="noreferrer"
                       style={{ fontFamily: 'var(--mono)', fontSize: 'var(--text-xs)', color: 'var(--ink-4)', textDecoration: 'none' }}>
                      ↗ PDF
                    </a>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

/* ---------------- Config view (read-only system status) ---------------- */
function KgView({ entities, kg }) {
  const [filter, setFilter] = useState('');
  const [typeFilter, setTypeFilter] = useState('all');
  const enrichedNames = Object.keys(kg || {});
  const total = entities.length;
  const enrichedCount = entities.filter(e => kg[e.name] && !kg[e.name].notFound).length;
  const notFoundCount = entities.filter(e => kg[e.name] && kg[e.name].notFound).length;
  const noDataCount = total - enrichedCount - notFoundCount;
  const byType = (() => {
    const m = {};
    for (const e of entities) {
      const k = kg[e.name];
      if (k && !k.notFound) m[k.type || 'Other'] = (m[k.type || 'Other'] || 0) + 1;
    }
    return m;
  })();
  const list = entities.filter(e => {
    const k = kg[e.name];
    if (typeFilter === 'enriched' && !(k && !k.notFound)) return false;
    if (typeFilter === 'notfound' && !(k && k.notFound)) return false;
    if (typeFilter === 'pending' && k) return false;
    if (['Person','Organization','Place','Event','Work','Other'].includes(typeFilter)) {
      if (!k || k.notFound || k.type !== typeFilter) return false;
    }
    if (filter && !e.name.toLowerCase().includes(filter.toLowerCase())) return false;
    return true;
  }).slice(0, 100);

  const typeColor = (t) => {
    const map = { Person: 'var(--ok)', Organization: 'var(--accent)', Place: 'var(--warn)', Event: '#7B61FF', Work: '#FF6B6B', Other: 'var(--ink-3)' };
    return map[t] || 'var(--ink-3)';
  };

  return (
    <div>
      <div style={{ padding: '8px 10px', background: 'var(--paper-3)', border: '1px solid var(--rule)', marginBottom: 12, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)', lineHeight: 1.6 }}>
        <strong style={{ color: 'var(--ink)' }}>{total}</strong> entidades en vivo · <strong style={{ color: 'var(--ok)' }}>{enrichedCount}</strong> enriquecidas Wikidata · <strong style={{ color: 'var(--warn)' }}>{notFoundCount}</strong> sin match · <strong style={{ color: 'var(--ink-4)' }}>{noDataCount}</strong> pendientes
        <br/>
        Por tipo: {Object.entries(byType).map(([t, n]) => <span key={t} style={{ marginRight: 10, color: typeColor(t) }}>{t} {n}</span>)}
        <br/>
        El poll Wikidata corre cada 6h y enriquece hasta 60 entidades por ejecución (max 5000 en cache).
      </div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 12, flexWrap: 'wrap' }}>
        {['all','enriched','notfound','pending','Person','Organization','Place','Event','Work'].map(t => (
          <span key={t} onClick={() => setTypeFilter(t)}
                style={{ cursor: 'pointer', padding: '4px 10px', fontFamily: 'var(--mono)', fontSize: 10, border: '1px solid var(--rule)', background: typeFilter === t ? 'var(--ink)' : 'transparent', color: typeFilter === t ? 'var(--paper)' : 'var(--ink)', letterSpacing: '.04em' }}>
            {t}
          </span>
        ))}
        <input value={filter} onChange={e => setFilter(e.target.value)} placeholder="filtrar por nombre…"
               style={{ marginLeft: 'auto', padding: '4px 10px', fontFamily: 'var(--mono)', fontSize: 11, border: '1px solid var(--rule)', background: 'transparent', color: 'var(--ink)', minWidth: 220 }} />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: 12 }}>
        {list.map((e, i) => {
          const k = kg[e.name] || {};
          const isEnriched = k.wdId && !k.notFound;
          return (
            <div key={i} style={{ border: '1px solid var(--rule-2)', padding: 10, background: 'var(--paper)' }}>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 6 }}>
                <strong style={{ fontFamily: 'var(--sans)', fontSize: 14, color: 'var(--ink)' }}>{e.name}</strong>
                {isEnriched && (
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 9, padding: '1px 5px', background: typeColor(k.type), color: 'var(--paper)', textTransform: 'uppercase', letterSpacing: '.05em' }}>{k.type}</span>
                )}
                {k.notFound && (
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--warn)' }}>no-match</span>
                )}
                {!k.wdId && !k.notFound && (
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--ink-4)' }}>pending</span>
                )}
                <span style={{ marginLeft: 'auto', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)' }}>s{e.score}</span>
              </div>
              {k.description && (
                <div style={{ fontFamily: 'var(--sans)', fontSize: 12, color: 'var(--ink-3)', lineHeight: 1.4, marginBottom: 6 }}>{k.description}</div>
              )}
              {(k.aliases || []).length > 0 && (
                <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)', marginBottom: 6 }}>
                  alias: {k.aliases.slice(0, 3).join(', ')}
                </div>
              )}
              <div style={{ display: 'flex', gap: 8, fontFamily: 'var(--mono)', fontSize: 10 }}>
                {k.wdId && <a href={`https://www.wikidata.org/wiki/${k.wdId}`} target="_blank" rel="noreferrer" style={{ color: 'var(--accent)' }}>{k.wdId}</a>}
                {k.wikipediaEs && <a href={k.wikipediaEs} target="_blank" rel="noreferrer" style={{ color: 'var(--accent)' }}>ES</a>}
                {k.wikipediaEn && <a href={k.wikipediaEn} target="_blank" rel="noreferrer" style={{ color: 'var(--accent)' }}>EN</a>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AuditorView() {
  const [headline, setHeadline] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  const audit = async () => {
    if (!headline.trim()) return;
    setLoading(true);
    try {
      const r = await fetch(`/api/audit-headline?h=${encodeURIComponent(headline.trim())}`, { credentials: 'same-origin' });
      const j = await r.json();
      setResult(j);
    } catch (e) {
      setResult({ error: e.message });
    } finally {
      setLoading(false);
    }
  };

  const sevColor = (s) => s === 'high' ? 'var(--danger)' : s === 'medium' ? 'var(--warn)' : 'var(--ink-3)';
  const verdictColor = result?.verdict === 'good' ? 'var(--ok)' : result?.verdict === 'review' ? 'var(--warn)' : 'var(--danger)';
  const verdictLabel = { good: '✓ BIEN', review: '⚠ REVISAR', rewrite: '✗ REESCRIBIR' };

  return (
    <div style={{ maxWidth: 900 }}>
      <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)', lineHeight: 1.5, marginBottom: 14 }}>
        Pega un titular y obtén score 0-100 + issues detectados + sugerencias.
        Reglas: longitud, all-caps, clickbait, curiosity gap, falta de entidad,
        falta de verbo, listicle largo, etc.
      </div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <input value={headline} onChange={e => setHeadline(e.target.value)}
               onKeyDown={e => e.key === 'Enter' && audit()}
               placeholder="Pedro Sánchez anuncia un cambio de gobierno tras la dimisión de…"
               style={{ flex: 1, padding: '8px 12px', fontFamily: 'var(--sans)', fontSize: 14, border: '1px solid var(--rule)', background: 'var(--paper)', color: 'var(--ink)' }} />
        <button onClick={audit} disabled={loading || !headline.trim()}
                style={{ padding: '8px 16px', fontFamily: 'var(--mono)', fontSize: 11, background: 'var(--ink)', color: 'var(--paper)', border: 'none', cursor: 'pointer', letterSpacing: '.05em' }}>
          {loading ? '…' : 'AUDITAR'}
        </button>
      </div>
      {result && !result.error && (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
          <div>
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--ink-4)', textTransform: 'uppercase', letterSpacing: '.05em' }}>Score Discover-friendly</div>
              <div style={{ fontFamily: 'var(--serif)', fontSize: 48, fontWeight: 800, color: verdictColor, lineHeight: 1 }}>
                {result.score}
              </div>
              <div style={{ fontFamily: 'var(--mono)', fontSize: 13, color: verdictColor, marginTop: 4, fontWeight: 700 }}>
                {verdictLabel[result.verdict]}
              </div>
              <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)', marginTop: 8 }}>
                {result.length} caracteres
              </div>
            </div>
            {(result.positives || []).length > 0 && (
              <div>
                <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>Positivos<span className="bar"></span><span className="meta">{result.positives.length}</span></div>
                {result.positives.map((p, i) => (
                  <div key={i} style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ok)', padding: '3px 0' }}>
                    ✓ {p}
                  </div>
                ))}
              </div>
            )}
          </div>
          <div>
            <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>
              Issues detectados<span className="bar"></span>
              <span className="meta">{result.issues.length}</span>
            </div>
            {result.issues.length === 0 ? (
              <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)', padding: 8 }}>
                Sin issues. Titular sólido.
              </div>
            ) : result.issues.map((iss, i) => (
              <div key={i} style={{ padding: '8px 10px', borderLeft: `3px solid ${sevColor(iss.severity)}`, background: 'var(--paper-3)', marginBottom: 6 }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 9, padding: '1px 6px', background: sevColor(iss.severity), color: 'var(--paper)', textTransform: 'uppercase', letterSpacing: '.05em' }}>
                    {iss.severity}
                  </span>
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)' }}>{iss.rule}</span>
                </div>
                <div style={{ fontFamily: 'var(--sans)', fontSize: 13, color: 'var(--ink)', marginTop: 4, lineHeight: 1.4 }}>
                  {iss.message}
                </div>
                {iss.suggestion && (
                  <div style={{ fontFamily: 'var(--sans)', fontSize: 12, color: 'var(--ink-3)', marginTop: 4, fontStyle: 'italic' }}>
                    → {iss.suggestion}
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
      {result?.error && (
        <div style={{ color: 'var(--danger)', fontFamily: 'var(--mono)', fontSize: 12 }}>Error: {result.error}</div>
      )}
    </div>
  );
}

function MundialView() {
  const [st, setSt] = useState({ loading: true, data: null, error: null });
  const [section, setSection] = useState('discover'); // discover | rss | entities | international
  const { imp, addNews } = useImports();
  const isImported = (id) => imp.news.some(n => n.id === id);

  useEffect(() => {
    let alive = true;
    fetch('/api/mundial', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(d => alive && setSt({ loading: false, data: d, error: null }))
      .catch(e => alive && setSt({ loading: false, data: null, error: e.message }));
    return () => { alive = false; };
  }, []);

  if (st.loading) return <div style={{ padding: 16, fontFamily: 'var(--mono)', color: 'var(--ink-3)' }}>Cargando…</div>;
  if (st.error) return <div style={{ padding: 16, color: 'var(--danger)' }}>Error: {st.error}</div>;
  const d = st.data || {};
  const sum = d.summary || {};

  const importBtn = (item) => {
    const id = `news::mundial::${item.url || item.link}`;
    const imported = isImported(id);
    const payload = {
      id, kind: 'news',
      country: item.country || 'ES',
      countryLabel: item.country ? item.country : 'Mundial · ES',
      title: item.title, url: item.url || item.link,
      domain: item.domain || (item.link && (() => { try { return new URL(item.link).hostname.replace(/^www\./,''); } catch { return ''; }})()) || '',
      category: `Mundial · ${item.keyword || ''}`,
      audienceScore: item.score || 0, maxScore: item.score || 0, hoursInFeed: 0,
    };
    return (
      <button onClick={() => addNews(payload)} disabled={imported}
              title={imported ? 'Ya importado' : 'Importar'}
              style={{
                cursor: imported ? 'default' : 'pointer',
                fontFamily: 'var(--mono)', fontSize: 10, padding: '0 6px',
                background: imported ? 'var(--ok)' : 'transparent',
                color: imported ? 'var(--paper)' : 'var(--accent)',
                border: `1px solid ${imported ? 'var(--ok)' : 'var(--accent)'}`,
                lineHeight: 1.4, marginLeft: 6,
              }}>
        {imported ? '✓' : '+'}
      </button>
    );
  };

  const sectionTabs = [
    { id: 'discover', label: 'Discover ES', count: sum.pages },
    { id: 'rss', label: 'RSS + Sitemap', count: sum.articles },
    { id: 'entities', label: 'Entidades DS', count: sum.entities },
    { id: 'international', label: 'Mundial × País', count: sum.internationalPages },
  ];

  return (
    <div>
      <div style={{ display: 'flex', gap: 14, padding: '8px 12px', background: 'var(--paper-3)', border: '1px solid var(--rule)', marginBottom: 12, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)', flexWrap: 'wrap', alignItems: 'baseline' }}>
        <span><strong style={{ color: 'var(--ink)' }}>{sum.articles || 0}</strong> RSS</span>
        <span><strong style={{ color: 'var(--accent)' }}>{sum.pages || 0}</strong> Discover</span>
        <span><strong style={{ color: 'var(--ink)' }}>{sum.entities || 0}</strong> entidades</span>
        <span><strong style={{ color: 'var(--ink)' }}>{sum.internationalPages || 0}</strong> intl pages</span>
        <span style={{ marginLeft: 'auto', color: 'var(--ink-4)' }}>ventana {d.windowHours}h</span>
      </div>

      {/* Keywords + publishers a la cabeza */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 14 }}>
        <div>
          <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>Keywords activas<span className="bar"></span><span className="meta">{(d.keywordsTop || []).length}</span></div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
            {(d.keywordsTop || []).map(k => (
              <span key={k.keyword} style={{ display: 'inline-block', padding: '3px 8px', fontFamily: 'var(--mono)', fontSize: 11, background: 'var(--paper-3)', color: 'var(--ink)', border: '1px solid var(--rule)' }}>
                {k.keyword} <strong style={{ color: 'var(--accent)' }}>×{k.count}</strong>
              </span>
            ))}
          </div>
        </div>
        <div>
          <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>Publishers cubriendo<span className="bar"></span><span className="meta">{(d.publisherSummary || []).length}</span></div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
            {(d.publisherSummary || []).slice(0, 14).map(p => (
              <span key={p.domain} style={{ display: 'inline-block', padding: '3px 8px', fontFamily: 'var(--mono)', fontSize: 11, background: 'var(--paper-3)', color: 'var(--ink)', border: '1px solid var(--rule)' }}>
                {p.domain} <strong style={{ color: 'var(--accent)' }}>{p.count}</strong>
              </span>
            ))}

                  <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)', marginTop: 4, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

          </div>

function ProduccionDiscoverView() {
  const [st, setSt] = useState({ loading: true, data: null, error: null });
  const [sortBy, setSortBy] = useState('ratio'); // ratio | discoverHits | production
  const [filter, setFilter] = useState('monitored');   // monitored | all | with-hits | no-hits | discover-only

  useEffect(() => {
    let alive = true;
    fetch('/api/production-vs-discover', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(d => alive && setSt({ loading: false, data: d, error: null }))
      .catch(e => alive && setSt({ loading: false, data: null, error: e.message }));
    return () => { alive = false; };
  }, []);

  if (st.loading) return <div style={{ padding: 16, fontFamily: 'var(--mono)', color: 'var(--ink-3)' }}>Cargando…</div>;
  if (st.error) return <div style={{ padding: 16, color: 'var(--danger)' }}>Error: {st.error}</div>;
  const d = st.data || {};
  let rows = d.rows || [];
  if (filter === 'monitored') rows = rows.filter(r => r.monitored && r.production > 0);
  else if (filter === 'with-hits') rows = rows.filter(r => r.discoverHits > 0);
  else if (filter === 'no-hits') rows = rows.filter(r => r.discoverHits === 0 && r.production > 0);
  else if (filter === 'discover-only') rows = rows.filter(r => !r.monitored && r.discoverHits > 0);
  rows = [...rows].sort((a, b) => {
    if (sortBy === 'ratio') return b.ratio - a.ratio || b.discoverHits - a.discoverHits;
    if (sortBy === 'discoverHits') return b.discoverHits - a.discoverHits;
    return b.production - a.production;
  });

  const ratioColor = (r) => r >= 20 ? 'var(--ok)' : r >= 10 ? 'var(--warn)' : 'var(--danger)';

  return (
    <div>
      <div style={{ padding: '10px 12px', background: 'var(--paper-3)', border: '1px solid var(--rule)', marginBottom: 14, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
        <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)' }}>
          Ventana <strong style={{ color: 'var(--ink)' }}>{d.windowHours}h</strong> ·
          {' '}<strong style={{ color: 'var(--ink)' }}>{d.totalPublishers}</strong> publishers ·
          {' '}<strong style={{ color: 'var(--ink)' }}>{d.totalProduction}</strong> artículos producidos ·
          {' '}<strong style={{ color: 'var(--accent)' }}>{d.totalDiscoverHits}</strong> pages en Discover
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {[
            { id: 'monitored', label: 'Monitorizados' },
            { id: 'with-hits', label: 'Con hits' },
            { id: 'no-hits', label: 'Producen sin entrar' },
            { id: 'discover-only', label: 'En Discover, no monitor.' },
            { id: 'all', label: 'Todos' },
          ].map(o => (
            <span key={o.id} onClick={() => setFilter(o.id)}
                  style={{ cursor: 'pointer', padding: '3px 10px', fontFamily: 'var(--mono)', fontSize: 10, border: '1px solid var(--rule)', background: filter === o.id ? 'var(--accent)' : 'transparent', color: filter === o.id ? '#fff' : 'var(--ink)' }}>
              {o.label}
            </span>
          ))}
        </div>
      </div>

      <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)', marginBottom: 8, lineHeight: 1.5 }}>
        Ratio = (pages en Discover últimas 24h / artículos publicados últimas 24h) × 100.
        Producción cuenta artículos RSS + sitemap-news con firstSeen ≤ 24h.
        Verde ≥20% (foco editorial), ámbar ≥10% (medio), rojo &lt;10% (volumen ineficiente o publisher fuera del scope Discover).
      </div>

      {rows.length === 0 ? (
        <div style={{ padding: 14, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)' }}>
          Sin datos. Necesita al menos 1 ciclo completo de media-poll + discover-poll.
        </div>
      ) : (
        <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--sans)', fontSize: 12 }}>
          <thead>
            <tr style={{ borderBottom: '2px solid var(--ink)' }}>
              <th style={{ textAlign: 'left', padding: '6px 6px', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '.05em' }}>Publisher</th>
              <th onClick={() => setSortBy('production')} style={{ textAlign: 'right', padding: '6px 6px', fontFamily: 'var(--mono)', fontSize: 10, color: sortBy === 'production' ? 'var(--accent)' : 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '.05em', cursor: 'pointer' }}>Producción</th>
              <th onClick={() => setSortBy('discoverHits')} style={{ textAlign: 'right', padding: '6px 6px', fontFamily: 'var(--mono)', fontSize: 10, color: sortBy === 'discoverHits' ? 'var(--accent)' : 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '.05em', cursor: 'pointer' }}>Discover</th>
              <th onClick={() => setSortBy('ratio')} style={{ textAlign: 'right', padding: '6px 6px', fontFamily: 'var(--mono)', fontSize: 10, color: sortBy === 'ratio' ? 'var(--accent)' : 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '.05em', cursor: 'pointer' }}>Ratio</th>
              <th style={{ textAlign: 'right', padding: '6px 6px', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '.05em' }}>Avg / Max</th>
              <th style={{ textAlign: 'left', padding: '6px 6px', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '.05em' }}>Top en Discover</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.domain} style={{ borderBottom: '1px solid var(--rule-2)' }}>
                <td style={{ padding: '6px 6px', fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--ink)', fontWeight: 600 }}>
                  {r.monitored ? '' : <span title="No monitorizamos este publisher por RSS/sitemap" style={{ color: 'var(--ink-4)', marginRight: 4 }}>○</span>}
                  {r.domain}
                </td>
                <td style={{ padding: '6px 6px', textAlign: 'right', fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--ink-3)' }}>
                  {r.production}
                </td>
                <td style={{ padding: '6px 6px', textAlign: 'right', fontFamily: 'var(--mono)', fontSize: 12, color: r.discoverHits > 0 ? 'var(--accent)' : 'var(--ink-4)', fontWeight: r.discoverHits > 0 ? 700 : 400 }}>
                  {r.discoverHits}
                </td>
                <td style={{ padding: '6px 6px', textAlign: 'right', fontFamily: 'var(--mono)', fontSize: 13, fontWeight: 700, color: ratioColor(r.ratio) }}>
                  {r.ratio}%
                </td>
                <td style={{ padding: '6px 6px', textAlign: 'right', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)' }}>
                  {r.discoverHits > 0 ? `s${r.avgDiscoverScore} / ${r.maxDiscoverScore}` : '—'}
                </td>
                <td style={{ padding: '6px 6px', color: 'var(--ink-3)', fontSize: 11, lineHeight: 1.4, maxWidth: 400 }}>
                  {(r.topDiscoverTitles || []).slice(0, 2).map((t, i) => (
                    <div key={i} style={{ display: '-webkit-box', WebkitLineClamp: 1, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>· {t}</div>
                  ))}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function ImportadosView() {
  const { imp, removeNews, removePattern, clearAll } = useImports();
  const total = imp.news.length + imp.patterns.length;

  const buildMarkdown = () => {
    const date = new Date().toLocaleString('es-ES');
    const lines = [];
    lines.push(`# Dossier Estadio Deportivo — ${date}`);
    lines.push('');
    lines.push('> Material extraído del Ranking Audience internacional + fórmulas detectadas en Discover.');
    lines.push('> Pégalo en Claude o ChatGPT con el prompt sugerido al final.');
    lines.push('');
    if (imp.news.length > 0) {
      lines.push(`## Noticias internacionales para adaptar (${imp.news.length})`);
      lines.push('');
      imp.news.forEach((n, i) => {
        lines.push(`### ${i + 1}. [${n.countryLabel || n.country}] ${n.title}`);
        lines.push(`- **Categoría:** ${n.category || '—'}`);
        lines.push(`- **Medio:** ${n.domain || n.publisher || '—'}`);
        lines.push(`- **Audience score:** ${n.audienceScore} (max ${n.maxScore} · ${n.hoursInFeed}h en feed)`);
        lines.push(`- **Link:** ${n.url}`);
        lines.push('');
      });
    }
    if (imp.patterns.length > 0) {
      lines.push(`## Patrones y fórmulas detectados (${imp.patterns.length})`);
      lines.push('');
      const formulas = imp.patterns.filter(p => p.kind === 'formula');
      const trigrams = imp.patterns.filter(p => p.kind === 'trigram');
      if (formulas.length > 0) {
        lines.push('### Fórmulas estructurales');
        lines.push('');
        formulas.forEach(f => {
          lines.push(`- **${f.label}** _(${f.countryLabel}, ×${f.count})_`);
          (f.examples || []).slice(0, 3).forEach(ex => lines.push(`  - ${ex}`));
        });
        lines.push('');
      }
      if (trigrams.length > 0) {
        lines.push('### N-gramas recurrentes');
        lines.push('');
        trigrams.forEach(t => {
          lines.push(`- **"${t.ngram}"** _(${t.countryLabel}, ×${t.count})_`);
          (t.examples || []).slice(0, 2).forEach(ex => lines.push(`  - ${ex}`));
        });
        lines.push('');
      }
    }
    lines.push('---');
    lines.push('');
    lines.push('## Prompt sugerido (pegar en Claude/ChatGPT después de este dossier)');
    lines.push('');
    lines.push('```');
    lines.push('Soy redactor de Estadio Deportivo. Te paso un dossier con noticias internacionales de alta audiencia y fórmulas editoriales detectadas hoy en mercados extranjeros.');
    lines.push('');
    lines.push('Tu tarea:');
    lines.push('1. Identifica las 3 noticias con mayor potencial para audiencia ES (público fútbol/deporte).');
    lines.push('2. Para cada una propón un titular ES adaptado (60-70 chars, sin clickbait, con entidad + verbo).');
    lines.push('3. Sugiere ángulo lateral diferenciado de la cobertura obvia.');
    lines.push('4. Si alguna fórmula encaja con la noticia, aplícala explícitamente.');
    lines.push('');
    lines.push('No inventes datos. Si falta contexto, márcalo como "verificar".');
    lines.push('```');
    return lines.join('\n');
  };

  const download = () => {
    const md = buildMarkdown();
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `dossier-ed-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'')}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const copyClipboard = () => {
    navigator.clipboard.writeText(buildMarkdown())
      .then(() => alert('Dossier copiado al portapapeles — pega en Claude/ChatGPT'))
      .catch(() => alert('No se pudo copiar — usa Descargar .md'));
  };

  return (
    <div>
      <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)', lineHeight: 1.5, marginBottom: 14 }}>
        Material seleccionado desde <strong>Ranking Audience</strong> (botón <code>+</code> en cada
        noticia) y <strong>Fórmulas/Trigramas internacionales</strong> (botón <code>+</code> al lado
        del recuento). Guardado en este dispositivo (LocalStorage). Exporta como dossier
        Markdown listo para pegar en Claude o ChatGPT con prompt incluido.
      </div>

      <div style={{ display: 'flex', gap: 8, marginBottom: 16, alignItems: 'center', flexWrap: 'wrap' }}>
        <button onClick={download} disabled={total === 0}
                style={{ padding: '8px 14px', fontFamily: 'var(--mono)', fontSize: 11, background: total > 0 ? 'var(--ink)' : 'var(--rule)', color: 'var(--paper)', border: 'none', cursor: total > 0 ? 'pointer' : 'default', letterSpacing: '.05em' }}>
          ↓ DESCARGAR .MD
        </button>
        <button onClick={copyClipboard} disabled={total === 0}
                style={{ padding: '8px 14px', fontFamily: 'var(--mono)', fontSize: 11, background: 'transparent', color: 'var(--ink)', border: '1px solid var(--ink)', cursor: total > 0 ? 'pointer' : 'default', letterSpacing: '.05em', opacity: total > 0 ? 1 : 0.4 }}>
          ⎘ COPIAR AL PORTAPAPELES
        </button>
        {total > 0 && (
          <button onClick={() => { if (confirm('¿Limpiar todos los importados?')) clearAll(); }}
                  style={{ padding: '8px 14px', fontFamily: 'var(--mono)', fontSize: 11, background: 'transparent', color: 'var(--danger)', border: '1px solid var(--danger)', cursor: 'pointer', letterSpacing: '.05em' }}>
            ✕ LIMPIAR TODO
          </button>
        )}
        <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)', marginLeft: 'auto' }}>
          {imp.news.length} noticias · {imp.patterns.length} patrones
        </span>
      </div>

      {total === 0 && (
        <div style={{ padding: 20, fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--ink-4)', background: 'var(--paper-3)', border: '1px dashed var(--rule)', textAlign: 'center' }}>
          Aún no has importado nada. Ve a <strong style={{ color: 'var(--accent)' }}>Internacional</strong> y pulsa <code>+</code> en las noticias del Ranking Audience o en las fórmulas detectadas.
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(440px, 1fr))', gap: 20 }}>
        {imp.news.length > 0 && (
          <div>
            <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>
              Noticias importadas<span className="bar"></span>
              <span className="meta">{imp.news.length}</span>
            </div>
            {imp.news.map(n => (
              <div key={n.id} style={{ padding: '8px 10px', borderLeft: '3px solid var(--accent)', background: 'var(--paper-3)', marginBottom: 8 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, alignItems: 'baseline' }}>
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-3)' }}>
                    {n.countryLabel || n.country} · {n.category}
                  </span>
                  <button onClick={() => removeNews(n.id)} title="Quitar"
                          style={{ cursor: 'pointer', fontFamily: 'var(--mono)', fontSize: 11, background: 'transparent', color: 'var(--ink-4)', border: 'none', padding: 0 }}>
                    ✕
                  </button>
                </div>
                <a href={n.url} target="_blank" rel="noreferrer"
                   style={{ fontFamily: 'var(--sans)', fontSize: 13, color: 'var(--ink)', fontWeight: 500, textDecoration: 'none', display: 'block', marginTop: 3, lineHeight: 1.3 }}>
                  {n.title}
                </a>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)', marginTop: 3 }}>
                  {n.domain || n.publisher} · audience <strong style={{ color: 'var(--accent)' }}>{n.audienceScore}</strong> · s{n.maxScore} · {n.hoursInFeed}h
                </div>
              </div>
            ))}
          </div>
        )}

        {imp.patterns.length > 0 && (
          <div>
            <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>
              Patrones / fórmulas importados<span className="bar"></span>
              <span className="meta">{imp.patterns.length}</span>
            </div>
            {imp.patterns.map(p => (
              <div key={p.id} style={{ padding: '6px 10px', borderLeft: `3px solid ${p.kind === 'formula' ? 'var(--warn)' : 'var(--ink-3)'}`, background: 'var(--paper-3)', marginBottom: 6 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, alignItems: 'baseline' }}>
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)' }}>
                    {p.kind === 'formula' ? 'Fórmula' : 'Trigrama'} · {p.countryLabel || p.country} · ×{p.count}
                  </span>
                  <button onClick={() => removePattern(p.id)} title="Quitar"
                          style={{ cursor: 'pointer', fontFamily: 'var(--mono)', fontSize: 11, background: 'transparent', color: 'var(--ink-4)', border: 'none', padding: 0 }}>
                    ✕
                  </button>
                </div>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--ink)', fontWeight: 600, marginTop: 2 }}>
                  {p.kind === 'formula' ? p.label : `"${p.ngram}"`}
                </div>
                {(p.examples || []).slice(0, 2).map((ex, i) => (
                  <div key={i} style={{ fontFamily: 'var(--sans)', fontSize: 11, color: 'var(--ink-3)', marginTop: 2, fontStyle: 'italic', lineHeight: 1.3 }}>
                    · {ex}
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function CompetitorsView({ competitors = [] }) {
  const [kindFilter, setKindFilter] = useState('all'); // 'all' | 'sport' | 'general'
  const filtered = kindFilter === 'all' ? competitors : competitors.filter(c => c.kind === kindFilter);
  const sorted = [...filtered].sort((a, b) => (b.pagesHistorical || 0) - (a.pagesHistorical || 0));
  const sportCount = competitors.filter(c => c.kind === 'sport').length;
  const generalCount = competitors.filter(c => c.kind === 'general').length;
  if (competitors.length === 0) {
    return (
      <div style={{ padding: 16, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)' }}>
        Sin datos de competidores. El primer poll de patterns histórico debe correr.
      </div>
    );
  }
  const ago = (ts) => {
    if (!ts) return '';
    const h = (Date.now() - new Date(ts).getTime()) / 3600_000;
    return h < 1 ? `${Math.round(h * 60)}m` : h < 24 ? `${Math.round(h)}h` : `${Math.round(h / 24)}d`;
  };
  return (
    <div>
      <div style={{ padding: '8px 10px', background: 'var(--paper-3)', border: '1px solid var(--rule)', marginBottom: 12, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-3)' }}>

      </div>
      {(sportCount > 0 && generalCount > 0) && (
        <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
          {[
            { id: 'all', label: 'Todos', n: competitors.length },
            { id: 'sport', label: '🏆 Deportivos', n: sportCount },
            { id: 'general', label: '📰 Generalistas', n: generalCount },
          ].map(c => (
            <span key={c.id} onClick={() => setKindFilter(c.id)}
                  style={{
                    cursor: 'pointer', padding: '4px 10px', fontFamily: 'var(--mono)', fontSize: 11,

                    color: kindFilter === c.id ? 'var(--paper)' : 'var(--ink)',
                    letterSpacing: '.04em',
                  }}>
              {c.label} <strong style={{ opacity: 0.7 }}>{c.n}</strong>
            </span>
          ))}
        </div>
      )}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(360px, 1fr))', gap: 14 }}>
        {sorted.map(c => (
          <div key={c.domain} style={{ border: '1px solid var(--rule)', padding: 12 }}>
            {/* Header con nombre + dominio + estado activo */}
            <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 8, paddingBottom: 6, borderBottom: '2px solid var(--accent)' }}>

                  {c.name}

                    <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-4)' }}>×{p.count}</span>
                  </div>

            )}

            {/* Samples */}
            {(c.samples || []).length > 0 && (

                {c.samples.slice(0, 3).map((s, i) => (
                  <a key={i} href={s.url} target="_blank" rel="noreferrer"
                     style={{ display: 'flex', gap: 6, padding: '4px 0', borderBottom: '1px solid var(--rule-2)', textDecoration: 'none', color: 'inherit' }}>
                    {s.image && <img src={s.image} alt="" style={{ width: 56, height: 32, objectFit: 'cover', border: '1px solid var(--rule)', flexShrink: 0 }} />}
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 11, color: 'var(--ink)', lineHeight: 1.3, display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{s.title}</div>
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--ink-4)' }}>s{s.score} · {ago(s.firstSeen)}</div>
                    </div>

                ))}

          </div>
        ))}
      </div>
    </div>
  );
}

                        <td style={{ padding: '4px 4px', textAlign: 'right', fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--ink-4)', whiteSpace: 'nowrap' }}>

                        </td>
                        <td style={{ padding: '4px 4px', width: 24, textAlign: 'center' }}>
                          <button
                            onClick={() => addNews({
                              id, kind: 'news', country: p.country, countryLabel: labels[p.country] || p.country,
                              title: p.title, url: p.url, domain: (p.domain || '').replace(/^www\./, ''),
                              publisher: p.publisher, category: group.category,
                              audienceScore: p.audienceScore, maxScore: p.maxScore, hoursInFeed: p.hoursInFeed,
                            })}
                            disabled={imported}
                            title={imported ? 'Ya importado' : 'Importar a "Importados"'}
                            style={{
                              cursor: imported ? 'default' : 'pointer',
                              fontFamily: 'var(--mono)', fontSize: 11, padding: '1px 6px',
                              background: imported ? 'var(--ok)' : 'transparent',
                              color: imported ? 'var(--paper)' : 'var(--accent)',
                              border: `1px solid ${imported ? 'var(--ok)' : 'var(--accent)'}`,
                              lineHeight: 1, opacity: imported ? 0.7 : 1,
                            }}>
                            {imported ? '✓' : '+'}
                          </button>
                        </td>
                      </tr>
                    );})}
                  </tbody>
                </table>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Análisis editorial — publishers, trigramas, fórmulas */}
      <div style={{ marginTop: 24, display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(360px, 1fr))', gap: 20 }}>
        {/* Publishers del país */}
        <div>
          <div className="kicker" style={{ borderTop: 'none', paddingTop: 0 }}>
            Publishers {labels[active]}<span className="bar"></span>
            <span className="meta">{(cur.publishers || []).length}</span>
          </div>
          {(cur.publishers || []).length === 0 ? (
            <div style={{ padding: 8, fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-4)' }}>Sin datos.</div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 6 }}>
              {(cur.publishers || []).slice(0, 12).map(pub => (
                <div key={pub.domain} style={{ padding: '6px 8px', borderLeft: '3px solid var(--accent)', background: 'var(--paper-3)' }}>
                  <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 8 }}>

                    <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ink-3)' }}>
                      {pub.count} pages · score {pub.avgScore}
                    </span>
                  </div>
                  {(pub.titles || []).slice(0, 2).map((t, i) => (
                    <div key={i} style={{ fontFamily: 'var(--sans)', fontSize: 12, color: 'var(--ink-3)', marginTop: 3, lineHeight: 1.3, display: '-webkit-box', WebkitLineClamp: 1, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
                      · {t}

                  ))}
                </div>

        <div>

            <span className="meta">{(cur.trigrams || []).length}</span>
          </div>
